# Ufuq AI Engine — Docker Compose (تشغيل محلي مجاني 100%)
#
# المكونات:
# - ollama:        مخدّم النماذج المحلية (LLM + embeddings إن أردت)
# - qdrant:        قاعدة البيانات المتجهية (hybrid search مدمج)
# - postgres:      بيانات الأعمال + pgvector (اختياري في MVP)
# - engine:        FastAPI + الـAgent + Docling
#
# التشغيل: docker compose up -d
# إيقاف:    docker compose down

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ufuq-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all          # يستغل RTX 4060
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ufuq-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ufuq-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ufuq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ufuq_secret}
      POSTGRES_DB: ${POSTGRES_DB:-ufuq}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ufuq-engine
    restart: unless-stopped
    ports:
      - "${ENGINE_PORT:-8000}:8000"
    env_file:
      - ../.env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ufuq}:${POSTGRES_PASSWORD:-ufuq_secret}@postgres:5432/${POSTGRES_DB:-ufuq}
    depends_on:
      - ollama
      - qdrant
    volumes:
      - local_storage:/app/local_storage
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_data:
  qdrant_data:
  postgres_data:
  local_storage:
