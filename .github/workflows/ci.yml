name: CI — Unit & Integration Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure environment for CI (mock LLM mode)
        run: |
          cp .env.example .env
          # Use Ollama provider name; tests never call the real API
          echo "CI_MODE=true" >> .env

      - name: Run unit tests
        run: python -m pytest tests/unit -v

      - name: Run integration tests
        run: python tests/integration_test.py

      - name: Compile-check all source files
        run: find app -name "*.py" -exec python -m py_compile {} +

      - name: Type hints sanity check
        run: |
          pip install -q pyright || true
          python -m pyright app --outputjson || python -m pyright app --stats
